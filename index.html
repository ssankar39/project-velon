<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BMR & TDEE Calculator</title>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <!-- BMR Calculator -->
  <section id="bmr-calculator" class="calculator">
    <h2>BMR Calculator</h2>
    <form id="bmr-form">
      <input type="number" placeholder="Age" id="age" required>
      
      <!-- Weight Input with Unit -->
      <div class="input-group">
        <input type="number" placeholder="Weight" id="weight" required>
        <select id="weight-unit">
          <option value="kg">kg</option>
          <option value="lbs">lbs</option>
        </select>
      </div>

      <!-- Height Input with Unit -->
      <div class="input-group">
        <input type="number" placeholder="Height" id="height" required>
        <select id="height-unit">
          <option value="cm">cm</option>
          <option value="in">inches</option>
        </select>
      </div>
        
      <select id="gender">
        <option value="male">Male</option>
        <option value="female">Female</option>
      </select>
      <button type="submit">Calculate BMR</button>
    </form>
    <p id="bmr-result" class="result"></p>
  </section>

  <!-- TDEE Calculator -->
  <section id="tdee-calculator" class="calculator">
    <h2>TDEE Calculator</h2>
    <div class="info-text">Calculate your BMR first to enable TDEE calculation</div>
    <form id="tdee-form">
      <select id="activity-level">
        <option value="1.2">Sedentary (little or no exercise)</option>
        <option value="1.375">Lightly active (light exercise 1-3 days/week)</option>
        <option value="1.55">Moderately active (moderate exercise 3-5 days/week)</option>
        <option value="1.725">Very active (hard exercise 6-7 days/week)</option>
        <option value="1.9">Super active (very hard exercise, physical job)</option>
      </select>
      <button type="submit">Calculate TDEE</button>
    </form>
    <p id="tdee-result" class="result"></p>
  </section>
</body>
</html>
